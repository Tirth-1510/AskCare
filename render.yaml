services:
  # Backend Web Service (Node.js Express App)
  - type: web
    name: askcare-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMOLLM_API_KEY
        sync: false
      - key: SMOLLM_API_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: SMOLLM_MODEL_NAME
        value: google/gemma-3-4b-it

  # Frontend Static Site (Vite React App)
  - type: static
    name: askcare-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: askcare-backend
          property: url
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
