services:
  # Unified Web Service (Express Server + React Static Assets)
  - type: web
    name: AskCare
    env: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMOLLM_API_KEY
        sync: false
      - key: SMOLLM_API_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: SMOLLM_MODEL_NAME
        value: google/gemma-3-4b-it
